<!doctype html>
<html lang="en" data-zcode-design>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galvena — the harness framework for Tauri 2.0</title>
    <meta
      name="description"
      content="Ten Rust crates keep the plumbing: the engine, the bus, the bridge, the vault. A developer assembles the harness on top. The starter, galvena/galvena, is a working harness out of the box."
    />
    <meta name="theme-color" content="#0E2340" />
    <script>
      // theme before first paint: stored choice wins, system is the default
      (function () {
        var t = "system";
        try {
          t = localStorage.getItem("theme") || "system";
        } catch (e) {}
        var light =
          t === "light" ||
          (t === "system" &&
            window.matchMedia("(prefers-color-scheme: light)").matches);
        document.documentElement.classList.toggle("light", light);
        document.documentElement.style.colorScheme = light ? "light" : "dark";
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", light ? "#F1EDE2" : "#0E2340");
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' fill='%230E2340'/%3E%3Crect x='6' y='6' width='20' height='20' fill='none' stroke='%23E8876B' stroke-width='2'/%3E%3Cpath d='M11 16h6M17 16v-3' stroke='%23E9F1FA' stroke-width='2' fill='none'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
